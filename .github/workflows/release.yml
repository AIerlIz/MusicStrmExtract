name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/MusicStrmExtract.Tests/MusicStrmExtract.Tests.csproj

      - name: Build
        run: dotnet build MusicStrmExtract/MusicStrmExtract.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/MusicStrmExtract.Tests/MusicStrmExtract.Tests.csproj -c Release --no-restore --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStrmExtract
          path: MusicStrmExtract/bin/Release/MusicStrmExtract.dll
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MusicStrmExtract/bin/Release/MusicStrmExtract.dll
          generate_release_notes: true
